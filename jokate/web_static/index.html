<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jokate</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --bg:#0b0e14; --bg2:#0f131b; --panel:#131822; --panel2:#171d29; --line:#222a38; --line2:#2c3648;
    --fg:#e8ecf3; --fg2:#b9c2d0; --dim:#7d8799; --dim2:#5b6577;
    --acc:#6c8cff; --acc2:#3fd2ff; --accg:linear-gradient(135deg,#6c8cff 0%,#3fd2ff 100%);
    --a:#3ddc84; --m:#ffb547; --r:#b48cff; --d:#ff5d6c; --n:#d8c25a;
    --shadow:0 10px 30px -10px rgba(0,0,0,.6), 0 2px 6px rgba(0,0,0,.35);
    --radius:12px;
    --left-w:380px; --changes-h:300px; --hist-h:300px; --row-pad:7px; --row-fs:13px; --thumb:28px; --ver-thumb:156px;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; display:flex; flex-direction:column; overflow:hidden; background:radial-gradient(1200px 600px at 20% -10%, #1a2340 0%, transparent 60%), radial-gradient(900px 500px at 100% 0%, #11303a 0%, transparent 55%), var(--bg);
         color:var(--fg); font:14px/1.5 "Pretendard Variable", Pretendard, system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing:-.01em; }
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-thumb { background:#283042; border-radius:10px; border:2px solid transparent; background-clip:padding-box; }
  ::-webkit-scrollbar-thumb:hover { background:#36405a; background-clip:padding-box; border:2px solid transparent; }
  button { font:inherit; white-space:nowrap; border:0; border-radius:9px; padding:8px 14px; cursor:pointer; color:#fff; background:var(--accg); font-weight:600; box-shadow:0 6px 16px -6px rgba(108,140,255,.6); transition:transform .08s, filter .15s, box-shadow .15s; }
  button:hover { filter:brightness(1.08); }
  button:active { transform:translateY(1px); }
  button.ghost { background:rgba(255,255,255,.04); color:var(--fg2); border:1px solid var(--line2); box-shadow:none; font-weight:500; }
  button.ghost:hover { background:rgba(255,255,255,.08); color:var(--fg); }
  button.small { padding:4px 10px; font-size:12px; border-radius:7px; }
  button.danger { background:linear-gradient(135deg,#ff5d6c,#ff8a5b); box-shadow:0 6px 16px -6px rgba(255,93,108,.6); }
  button:disabled { opacity:.45; cursor:default; filter:none; transform:none; }
  input[type=text], input:not([type]) { font:inherit; background:rgba(0,0,0,.25); color:var(--fg); border:1px solid var(--line2); border-radius:9px; padding:8px 12px; outline:none; transition:border-color .15s, box-shadow .15s; }
  input:focus { border-color:var(--acc); box-shadow:0 0 0 3px rgba(108,140,255,.2); }

  /* ---------- 헤더 ---------- */
  #staleBar { display:none; align-items:center; gap:10px; padding:8px 20px; font-size:13px; font-weight:600;
              color:var(--m); background:rgba(255,181,71,.14); border-bottom:1px solid var(--line2); }
  #staleBar.show { display:flex; }
  header { display:flex; align-items:center; flex-wrap:wrap; row-gap:8px; gap:12px; padding:12px 20px; border-bottom:1px solid var(--line); background:rgba(15,19,27,.75); backdrop-filter:blur(10px); position:sticky; top:0; z-index:20; }
  .logo { display:flex; align-items:center; gap:10px; margin-right:8px; }
  .logo .mark { width:30px; height:30px; border-radius:9px; background:var(--accg); display:grid; place-items:center; font-weight:800; color:#0b0e14; box-shadow:0 6px 16px -4px rgba(63,210,255,.6); }
  .logo h1 { margin:0; font-size:16px; font-weight:700; letter-spacing:-.02em; }
  .logo .proj { font-size:12px; color:var(--dim); margin-left:6px; padding:2px 8px; border:1px solid var(--line2); border-radius:999px; }
  header input { flex:1 1 260px; min-width:220px; max-width:520px; }
  #status { color:var(--dim); font-size:12px; margin-left:auto; white-space:nowrap; }
  #showNoise { font-size:12px; color:var(--dim); display:flex; align-items:center; gap:6px; white-space:nowrap; cursor:pointer; user-select:none; }
  #showNoise input { accent-color:var(--acc); }

  /* ---------- 통계 바 ---------- */
  #statsWrap > .ph { display:flex; align-items:center; gap:8px; padding:6px 20px 0; }
  #statsWrap > .ph .spacer { flex:1; }
  #statsWrap.folded #stats { display:none; }
  #statsMini { display:none; padding:6px 20px 0; font-size:12px; color:var(--dim); }
  #statsWrap.folded #statsMini { display:block; }
  #stats { display:flex; gap:10px; padding:12px 20px 0; flex-wrap:wrap; }
  .stat { flex:1 1 140px; background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.015)); border:1px solid var(--line); border-radius:var(--radius); padding:10px 14px; min-width:140px; }
  .stat .l { font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.06em; }
  .stat .v { font-size:20px; font-weight:700; margin-top:2px; letter-spacing:-.02em; }
  .stat .v small { font-size:12px; color:var(--dim); font-weight:500; margin-left:4px; }
  .stat.hot .v { background:var(--accg); -webkit-background-clip:text; background-clip:text; color:transparent; }

  /* ---------- 레이아웃 ---------- */
  main { display:grid; grid-template-columns:var(--left-w) 6px 1fr; gap:0 12px; padding:12px 20px 20px; flex:1; min-height:0; }
  main.full { grid-template-columns:1fr; }
  main.full #left, main.full #vsplit { display:none; }
  header, #statsWrap { flex:0 0 auto; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); min-height:0; display:flex; flex-direction:column; overflow:hidden; }
  .card > .ph { display:flex; gap:8px; align-items:center; padding:10px 14px; border-bottom:1px solid var(--line); background:linear-gradient(180deg, rgba(255,255,255,.03), transparent); }
  .card > .ph b { font-size:13px; font-weight:700; }
  .card > .ph .spacer { flex:1; }
  .card.folded { flex:0 0 auto !important; }
  .card.folded > :not(.ph) { display:none; }
  button.fold { background:transparent; box-shadow:none; padding:2px 6px; font-weight:700; color:var(--dim); }
  button.fold:hover { color:var(--fg); background:rgba(255,255,255,.06); }
  #left { display:flex; flex-direction:column; min-height:0; }
  #changes { flex:0 0 var(--changes-h); max-height:none; }
  #changes.hot { box-shadow:0 0 0 2px var(--a), var(--shadow); }
  #changesBody { overflow:auto; }
  #changes .sum { padding:8px 14px 4px; font-size:12px; color:var(--dim); }
  #changes td, #changes th { padding:5px 8px; font-size:12px; }
  #changes table { table-layout:fixed; }
  #changes th.cb { width:30px; } #changes th.tn { width:36px; } #changes th:nth-child(3) { width:36px; } #changes th:nth-child(5) { width:112px; }
  #changes td:nth-child(6), #changes th:nth-child(6) { display:none; }
  #changes td .rel, #detail td .rel { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #changes td:nth-child(4) { overflow:hidden; }
  #changes .badge { white-space:nowrap; }
  #tlcard { flex:1 1 auto; min-height:0; }
  #timeline { overflow:auto; flex:1; padding:6px 0 12px; position:relative; }

  /* ---------- 경계선(splitter) ---------- */
  .splitter { position:relative; z-index:5; flex:0 0 auto; }
  .splitter::after { content:""; position:absolute; background:var(--line2); }
  .splitter.col { width:6px; cursor:col-resize; }
  .splitter.col::after { left:2px; right:2px; top:0; bottom:0; }
  .splitter.row { height:6px; cursor:row-resize; margin:6px 0; }
  .splitter.row::after { top:2px; bottom:2px; left:0; right:0; }
  .splitter:hover::after, .splitter.drag::after { background:var(--acc); }
  .splitter:focus-visible { outline:2px solid var(--acc); outline-offset:1px; }
  body.dragging { user-select:none; }
  body.dragging * { transition:none !important; }
  #hsplit { flex:0 0 auto; }
  #histSplit { flex:0 0 auto; }
  #detail { padding:0; display:flex; flex-direction:column; overflow:hidden; }
  #detail > .ph { flex:0 0 auto; }
  #detailMain { overflow:auto; flex:1 1 auto; min-height:0; }
  #histPane { flex:0 0 var(--hist-h); overflow:auto; min-height:0; }
  #detail.histfold #histPane { flex:0 0 auto; overflow:hidden; }
  #detail.histfold #history > *:not(.sect) { display:none; }
  #detail.histfold #histSplit { display:none !important; }

  /* ---------- 타임라인 ---------- */
  .snap { position:relative; padding:10px 14px 10px 40px; cursor:pointer; transition:background .12s; border-left:3px solid transparent; }
  .snap::before { content:""; position:absolute; left:19px; top:0; bottom:0; width:2px; background:var(--line2); }
  .snap:first-child::before { top:18px; }
  .snap:last-child::before { bottom:calc(100% - 18px); }
  .snap::after { content:""; position:absolute; left:14px; top:14px; width:12px; height:12px; border-radius:50%; background:var(--dim2); border:2px solid var(--panel); box-shadow:0 0 0 2px var(--line2); }
  .snap.label::after { background:var(--accg); box-shadow:0 0 0 2px var(--acc), 0 0 12px rgba(108,140,255,.7); }
  .snap.noise::after { background:var(--n); box-shadow:0 0 0 2px #6a5f2a; }
  .snap:hover { background:rgba(255,255,255,.03); }
  .snap.sel { background:linear-gradient(90deg, rgba(108,140,255,.14), transparent); border-left-color:var(--acc); }
  .snap.msel { box-shadow:inset 0 0 0 1px var(--acc); border-radius:8px; }
  .stat .v .mini { margin-left:8px; vertical-align:middle; }
  .snap .msg { font-weight:600; display:flex; align-items:center; gap:6px; }
  .snap.auto .msg { color:var(--fg2); font-weight:500; }
  .snap .id { font-size:11px; color:var(--dim); font-variant-numeric:tabular-nums; }
  .snap .meta { font-size:12px; color:var(--dim); margin-top:1px; }
  .snap .counts { font-size:12px; margin-top:4px; display:flex; gap:5px; flex-wrap:wrap; }
  .snap.noise { opacity:.5; }
  .snap.noise.sel { opacity:.9; }
  .hidden-noise { margin:4px 14px 4px 40px; padding:5px 10px; font-size:11px; color:var(--dim); border:1px dashed var(--line2); border-radius:8px; cursor:pointer; }
  .hidden-noise:hover { color:var(--fg2); border-color:var(--dim2); }
  .snap .hits { font-size:11px; color:var(--acc2); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* ---------- 검색 ---------- */
  #tlcard .ph input { flex:1; min-width:60px; padding:4px 10px; font-size:12px; border-radius:8px; }
  #qinfo { white-space:nowrap; }

  /* ---------- 행 썸네일 ---------- */
  td.tn, th.tn { width:36px; padding-right:0; }
  .th28 { width:28px; height:28px; border-radius:7px; display:grid; place-items:center; object-fit:cover;
          background:rgba(255,255,255,.04); border:1px solid var(--line); font-size:12px; font-weight:700; color:#0b0e14; }
  tr.row.match td:first-child { box-shadow:inset 3px 0 0 var(--acc); }

  /* ---------- 배지·필 ---------- */
  .pill { display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:600; padding:1px 8px; border-radius:999px; background:rgba(255,255,255,.06); color:var(--fg2); }
  .pill.modified { color:var(--m); background:rgba(255,181,71,.12); }
  .pill.added { color:var(--a); background:rgba(61,220,132,.12); }
  .pill.moved { color:var(--r); background:rgba(180,140,255,.12); }
  .pill.deleted { color:var(--d); background:rgba(255,93,108,.12); }
  .pill.resave { color:var(--n); background:rgba(216,194,90,.12); }
  .pill.on { color:var(--a); background:rgba(61,220,132,.14); }
  .pill.paused { color:var(--m); background:rgba(255,181,71,.14); }
  .pill.act { cursor:pointer; user-select:none; }
  .pill.act:hover { filter:brightness(1.15); }
  #dead { position:fixed; inset:0; z-index:200; display:grid; place-items:center; background:rgba(11,14,20,.92);
          color:var(--fg2); font-size:18px; font-weight:600; text-align:center; }
  .badge { display:inline-block; font-size:11px; padding:0 8px; border-radius:999px; margin:2px 4px 0 0; font-weight:500;
           background:hsl(var(--h) 60% 22% / .7); color:hsl(var(--h) 90% 78%); border:1px solid hsl(var(--h) 50% 32% / .8); }
  .badge.noise { --h:50; }
  .k { font-weight:800; width:34px; font-variant-numeric:tabular-nums; }
  .k span { display:inline-block; min-width:22px; text-align:center; border-radius:6px; padding:0 5px; font-size:11px; }
  .k.A span { color:var(--a); background:rgba(61,220,132,.14); } .k.M span { color:var(--m); background:rgba(255,181,71,.14); }
  .k.R span { color:var(--r); background:rgba(180,140,255,.14); } .k.D span { color:var(--d); background:rgba(255,93,108,.14); }
  tr.noise .k span { color:var(--n); background:rgba(216,194,90,.14); }
  tr.noise { opacity:.55; }

  /* ---------- 표 ---------- */
  table { border-collapse:separate; border-spacing:0; width:100%; margin:6px 0 12px; }
  td, th { text-align:left; padding:var(--row-pad) 10px; border-bottom:1px solid var(--line); font-size:var(--row-fs); }
  .th28 { width:var(--thumb); height:var(--thumb); }
  body.nothumb td.tn, body.nothumb th.tn { display:none; }
  th { color:var(--dim); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.05em; position:sticky; top:0; background:var(--panel); z-index:1; }
  th.cb, td.cb { width:30px; padding-right:0; }
  td.cb input, th.cb input { accent-color:var(--acc); }
  tr.row { cursor:pointer; user-select:none; transition:background .1s; }
  tr.row:hover { background:rgba(255,255,255,.035); }
  tr.row.sel { background:rgba(108,140,255,.16); }
  tr.row.sel td { border-bottom-color:rgba(108,140,255,.25); }
  tr.row.hist td:nth-child(3) { color:var(--acc2); }
  .selcount { color:var(--acc2); font-size:11px; font-weight:600; margin-left:6px; text-transform:none; letter-spacing:0; }
  .rel { font-family:ui-monospace, "Cascadia Code", Consolas, monospace; font-size:12.5px; }
  .rel .dir { color:var(--dim); }
  .dim { color:var(--dim); }
  .hint { font-size:12px; color:var(--dim2); }

  /* ---------- 상세 ---------- */
  #detail .empty { height:100%; display:grid; place-items:center; color:var(--dim); text-align:center; padding:40px; }
  #detail .empty .ico { font-size:44px; margin-bottom:10px; opacity:.6; }
  .dhead { padding:16px 20px 12px; border-bottom:1px solid var(--line); background:linear-gradient(180deg, rgba(108,140,255,.07), transparent); }
  .dhead h2 { margin:0; font-size:18px; font-weight:700; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .dhead h2 .id { font-size:12px; color:var(--acc2); font-weight:700; padding:2px 8px; border:1px solid rgba(63,210,255,.35); border-radius:999px; }
  .dhead .sub { color:var(--dim); font-size:12px; margin-top:4px; }
  .dhead .bar { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .dbody { padding:6px 20px 20px; }
  .sect { margin-top:18px; display:flex; align-items:center; gap:10px; }
  .sect h3 { margin:0; font-size:13px; font-weight:700; color:var(--fg2); }
  .sect .hint { margin-left:auto; }
  #restore { margin-top:10px; }
  .agg { display:flex; gap:8px; flex-wrap:wrap; margin:4px 0 8px; }
  .agg .cell { background:rgba(255,255,255,.03); border:1px solid var(--line); border-radius:9px; padding:6px 10px; font-size:12px; display:flex; gap:8px; align-items:center; }

  /* ---------- 버전 히스토리 ---------- */
  .versions { display:flex; gap:12px; overflow-x:auto; padding:8px 2px 12px; }
  .ver { flex:0 0 calc(var(--ver-thumb) + 16px); background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:8px; font-size:12px; cursor:context-menu; transition:transform .12s, border-color .12s, box-shadow .12s; }
  .ver:hover { transform:translateY(-2px); border-color:var(--line2); box-shadow:var(--shadow); }
  .ver.changed { border-color:rgba(255,181,71,.5); }
  .ver .th { position:relative; width:var(--ver-thumb); height:var(--ver-thumb); border-radius:9px; overflow:hidden; background:
      linear-gradient(45deg,#0d1017 25%,transparent 25%,transparent 75%,#0d1017 75%),linear-gradient(45deg,#0d1017 25%,#131722 25%,#131722 75%,#0d1017 75%);
      background-size:16px 16px; background-position:0 0,8px 8px; margin-bottom:8px; display:grid; place-items:center; }
  .ver img { width:var(--ver-thumb); height:var(--ver-thumb); object-fit:contain; display:block; }
  .ver .nothumb { color:var(--dim2); font-size:12px; }
  .ver .tag { position:absolute; top:6px; left:6px; }
  .ver .vid { font-weight:700; }
  .ver .sha { font-family:ui-monospace, Consolas, monospace; color:var(--dim); }
  .ver .vmsg { color:var(--fg2); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* ---------- 의미 diff ---------- */
  #metadiff { margin-bottom:6px; }
  #metadiff table { width:100%; }
  #metadiff td, #metadiff th { padding:4px 8px; }
  #metadiff .rname { font-weight:700; }
  #metadiff tr.mrow.add { background:rgba(61,220,132,.10); }
  #metadiff tr.mrow.del { background:rgba(255,93,108,.10); }
  #metadiff .old { text-decoration:line-through; color:var(--dim); }
  #metadiff .new { color:var(--m); font-weight:700; }
  #metadiff .arrow { color:var(--dim2); margin:0 4px; }
  #metadiff .cols { display:flex; gap:6px; flex-wrap:wrap; margin:4px 0 8px; }
  #metadiff .same { color:var(--dim); font-size:12px; margin-top:4px; }
  .ver .meta { color:var(--a); font-size:11px; }

  /* ---------- 알림 박스 ---------- */
  .warn, .err, .note { border-radius:10px; padding:10px 14px; margin:8px 0; font-size:13px; }
  .warn { background:rgba(255,181,71,.1); border:1px solid rgba(255,181,71,.4); }
  .err { background:rgba(255,93,108,.1); border:1px solid rgba(255,93,108,.45); color:#ffc2c8; }
  .note { background:rgba(108,140,255,.1); border:1px solid rgba(108,140,255,.4); }
  .ok { color:var(--a); font-weight:600; }
  ul.dirty { margin:6px 0 0; padding-left:18px; }

  /* ---------- 컨텍스트 메뉴 ---------- */
  #ctx { display:none; position:fixed; z-index:50; min-width:250px; background:rgba(23,29,41,.92); backdrop-filter:blur(12px); border:1px solid var(--line2); border-radius:11px; box-shadow:var(--shadow); padding:6px; animation:pop .1s ease-out; }
  #ctx .item { padding:8px 12px; cursor:pointer; font-size:13px; border-radius:7px; display:flex; align-items:center; gap:10px; }
  #ctx .item .ic { width:18px; text-align:center; opacity:.8; }
  #ctx .item:hover { background:rgba(108,140,255,.18); }
  #ctx .item.disabled { color:var(--dim2); cursor:default; }
  #ctx .item.disabled:hover { background:transparent; }
  #ctx .sep { border-top:1px solid var(--line); margin:5px 4px; }
  @keyframes pop { from { transform:scale(.96) translateY(-3px); } to { transform:none; } }

  /* ---------- 보기 옵션 메뉴 ---------- */
  #viewMenu { display:none; position:fixed; z-index:50; width:230px; background:rgba(23,29,41,.96); backdrop-filter:blur(12px); border:1px solid var(--line2); border-radius:11px; box-shadow:var(--shadow); padding:10px; font-size:12px; }
  #viewMenu .vsec { margin-bottom:10px; }
  #viewMenu .vsec:last-child { margin-bottom:0; }
  #viewMenu .vlabel { color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.05em; margin-bottom:6px; }
  #viewMenu .vrow { display:flex; gap:4px; }
  #viewMenu .vrow button { flex:1; padding:5px 4px; font-size:11px; }
  #viewMenu .vrow button.on { background:var(--accg); color:#fff; box-shadow:none; }
  #viewMenu label { display:flex; align-items:center; gap:6px; cursor:pointer; user-select:none; }
  #viewMenu #resetLayout { width:100%; margin-top:2px; }

  /* ---------- 모달 ---------- */
  #modal { display:none; position:fixed; inset:0; z-index:40; background:rgba(5,7,12,.6); backdrop-filter:blur(6px); align-items:center; justify-content:center; }
  #modalBox { background:var(--panel); border:1px solid var(--line2); border-radius:16px; width:min(800px, 92vw); max-height:88vh; overflow:auto; padding:20px 24px; box-shadow:0 30px 80px -20px rgba(0,0,0,.8); animation:rise .16s ease-out; }
  @keyframes rise { from { transform:translateY(12px) scale(.985); } to { transform:none; } }
  #modalBox h3 { margin:0 0 6px; font-size:17px; font-weight:700; }
  #modalBox input { width:100%; margin:10px 0; }
  #modalBox .err, #modalBox table { max-height:240px; overflow:auto; display:block; }
  #modalBox table { display:table; max-height:none; }
  #modalBox .tbl { max-height:260px; overflow:auto; }
  .btns { display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }

  /* ---------- 토스트 ---------- */
  #toast { position:fixed; right:20px; bottom:20px; z-index:60; display:flex; flex-direction:column; gap:8px; }
  #toast div { background:rgba(19,24,34,.95); border:1px solid rgba(61,220,132,.5); border-left:4px solid var(--a); border-radius:10px; padding:10px 16px; box-shadow:var(--shadow); animation:toastin .2s ease-out, fade 4.2s forwards; font-weight:500; }
  #toast div { display:flex; align-items:center; gap:10px; }
  #toast div.bad { border-color:rgba(255,93,108,.5); border-left-color:var(--d); }
  #toast div.keep { animation:toastin .2s ease-out, fade 10s forwards; }
  @keyframes toastin { from { transform:translateX(24px); } to { transform:none; } }
  @keyframes fade { 0%,85% { opacity:1; } 100% { opacity:0; } }

  @media (max-width: 900px) {
    /* 단일 열: 아래 카드(상세)를 보려면 body 세로 스크롤이 필요하다 */
    html, body { height:auto; }
    body { overflow-y:auto; min-height:100%; }
    header { position:static; }
    header input { flex-basis:100%; max-width:none; order:5; }
    main, main.full { grid-template-columns:1fr; height:auto; flex:0 0 auto; }
    #vsplit { display:none; }
    #left { display:block; }
    .card { max-height:70vh; }
    #changes { max-height:50vh; height:auto; }
    #tlcard { max-height:60vh; }
    #detail { max-height:none; }
  }
</style>
</head>
<body>
<div id="staleBar">
  <span>서버가 최신 코드보다 오래됐습니다 — 재시작이 필요합니다</span>
  <button class="ghost small" id="staleRestart">지금 재시작</button>
</div>
<header>
  <div class="logo"><div class="mark">J</div><h1>Jokate</h1><span class="proj" id="proj">…</span></div>
  <input id="msg" placeholder="스냅샷 메시지 — 예: 대시 공격 몽타주 연결" maxlength="200">
  <button id="mksnap">스냅샷 만들기</button>
  <button id="reload" class="ghost">새로고침</button>
  <label id="showNoise"><input type="checkbox" id="showNoiseCb"> 리세이브 스냅샷 보기</label>
  <button id="viewBtn" class="ghost small">보기</button>
  <span class="pill" id="dchip">…</span>
  <button id="dstop" class="ghost small" style="display:none">종료</button>
  <span id="status"></span>
</header>
<section id="statsWrap">
  <div class="ph"><span class="spacer"></span><button class="fold" data-fold="stats" title="요약 접기/펼치기">▾</button></div>
  <div id="stats">
    <div class="stat hot"><div class="l">올릴 변경</div><div class="v" id="stChanges">–</div></div>
    <div class="stat"><div class="l">스냅샷</div><div class="v" id="stSnaps">–</div></div>
    <div class="stat"><div class="l">추적 애셋</div><div class="v" id="stAssets">–</div></div>
    <div class="stat"><div class="l">저장소</div><div class="v"><span id="stStore">–</span><button id="pruneBtn" class="ghost small mini" title="오래된 자동 스냅샷과 참조 없는 객체 정리">정리</button></div></div>
    <div class="stat"><div class="l">마지막 스냅샷</div><div class="v" id="stLast">–</div></div>
  </div>
  <div id="statsMini"></div>
</section>
<main id="main">
  <div id="left">
    <div id="changes" class="card" data-list="changes">
      <div class="ph"><b>현재 변경사항</b><span class="selcount"></span><span class="spacer"></span><button id="reloadStatus" class="ghost small">새로고침</button><button class="fold" data-fold="changes" title="접기/펼치기">▾</button></div>
      <div id="changesBody"><p class="dim" style="padding:12px 14px">불러오는 중…</p></div>
    </div>
    <div id="hsplit" class="splitter row" tabindex="0" role="separator" aria-orientation="horizontal" aria-label="변경사항/타임라인 경계선"></div>
    <div id="tlcard" class="card">
      <div class="ph"><b>타임라인</b><input id="q" placeholder="애셋·클래스·메시지 검색  /" maxlength="80"><button id="qclear" class="ghost small" style="display:none" title="검색 해제 (Esc)">✕</button><span class="hint" id="qinfo">라벨 = 밝은 점 · 자동 = 흐린 점</span><button class="fold" data-fold="tlcard" title="접기/펼치기">▾</button></div>
      <div id="timeline"></div>
    </div>
  </div>
  <div id="vsplit" class="splitter col" tabindex="0" role="separator" aria-orientation="vertical" aria-label="왼쪽 열 경계선"></div>
  <div id="detail" class="card">
    <div class="ph" id="detailHead"><b>상세</b><span class="spacer"></span><button id="fullBtn" class="ghost small" title="크게 보기 (f)">⤢</button></div>
    <div id="detailMain" data-list="detail"><div class="empty"><div><div class="ico">🕘</div>왼쪽 타임라인에서 스냅샷을 선택하세요</div></div></div>
    <div id="histSplit" class="splitter row" tabindex="0" role="separator" aria-orientation="horizontal" aria-label="버전 히스토리 경계선" style="display:none"></div>
    <div id="histPane" style="display:none"><div id="history"></div></div>
  </div>
</main>
<div id="ctx"></div>
<div id="viewMenu">
  <div class="vsec"><div class="vlabel">목록 밀도</div><div class="vrow">
    <button data-density="compact">촘촘</button><button data-density="normal">보통</button><button data-density="roomy">넉넉</button>
  </div></div>
  <div class="vsec"><div class="vlabel">버전 카드 썸네일</div><div class="vrow">
    <button data-verthumb="96">작게</button><button data-verthumb="156">보통</button><button data-verthumb="224">크게</button>
  </div></div>
  <div class="vsec"><label><input type="checkbox" id="optRowThumb" checked> 행 썸네일 표시</label></div>
  <div class="vsec"><button id="resetLayout" class="ghost small">레이아웃 초기화</button></div>
</div>
<div id="modal"><div id="modalBox"></div></div>
<div id="toast"></div>
<script>
const KIND = {added:'추가', modified:'수정', resave:'리세이브', moved:'이동', deleted:'삭제'};
const ORDER = ['modified','added','moved','deleted','resave'];
let selected = null, selectedRel = null, headId = null, lastLog = [];
let tlSel = new Set(), tlAnchor = null;      // 타임라인 다중 선택 (Ctrl 토글 · Shift 범위)
let searchHits = null, searchTimer = null;   // searchHits: Map<snapshot id, {matched, by}> · null = 검색 안 함
const NOISE_KEY = 'jokate.showNoise';
let showNoise = localStorage.getItem(NOISE_KEY) === '1';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const status = t => { $('#status').textContent = t; };
const JSONH = {'Content-Type': 'application/json'};
const hue = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h % 360; };
const fmtB = n => n == null ? '' : n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : n >= 1024 ? (n / 1024).toFixed(1) + ' KB' : n + ' B';
const relHtml = rel => { const i = rel.lastIndexOf('/'); return i < 0 ? `<span class="rel">${esc(rel)}</span>` : `<span class="rel"><span class="dir">${esc(rel.slice(0, i + 1))}</span>${esc(rel.slice(i + 1))}</span>`; };

async function api(path, opt) {
  const r = await fetch(path, opt);
  const j = await r.json().catch(() => ({error: r.statusText}));
  if (!r.ok) {
    const e = new Error(j.error || String(r.status)); e.status = r.status; e.body = j;
    if (r.status === 404 && j.error === String(path).split('?')[0]) showStale();  // 라우트 자체가 없음 = 낡은 서버
    throw e;
  }
  return j;
}
// ---- 낡은 서버 감지 / 재시작 ----
let buildId = null;
function showStale() { $('#staleBar').classList.add('show'); }
async function restartServer() {
  try {
    await api('/api/daemon', {method: 'POST', headers: JSONH, body: JSON.stringify({action: 'restart'})});
  } catch (e) {
    toast('재시작할 수 없습니다 — start.bat 을 다시 실행하세요 (열려 있는 jokate 콘솔 창은 닫기)', true);
    return;
  }
  toast('서버를 재시작하는 중…');
  let n = 0;
  const t = setInterval(async () => {
    n += 1;
    try {
      const i = await api('/api/info');
      if (buildId && i.build && i.build !== buildId) { clearInterval(t); location.reload(); }
    } catch (e) { /* 재시작 중에는 연결이 끊긴다 */ }
    if (n > 30) clearInterval(t);
  }, 1000);
}
function toast(msg, bad, action) {
  const d = document.createElement('div'); if (bad) d.className = 'bad';
  const sp = document.createElement('span'); sp.textContent = msg; d.appendChild(sp);
  let ms = 4400;
  if (action) {   // 액션 토스트만 10초 유지
    d.classList.add('keep'); ms = action.ms || 10000;
    const b = document.createElement('button');
    b.className = 'ghost small'; b.textContent = action.label;
    b.onclick = () => { d.remove(); action.run(); };
    d.appendChild(b);
  }
  $('#toast').appendChild(d); setTimeout(() => d.remove(), ms);
}
// 행 썸네일 (실패 시 클래스 해시 색 + 첫 글자 플레이스홀더)
function thumbHtml(cls, src) {
  const c = cls || '?';
  if (!src) return `<span class="th28" style="background:hsl(${hue(c)} 45% 38%)">${esc(c.slice(0, 1))}</span>`;
  return `<img class="th28" loading="lazy" src="${src}" alt="" data-cls="${esc(c)}" onerror="thumbFail(this)">`;
}
function thumbFail(img) {
  const c = img.dataset.cls || '?';
  const s = document.createElement('span');
  s.className = 'th28'; s.style.background = `hsl(${hue(c)} 45% 38%)`; s.textContent = c.slice(0, 1);
  img.replaceWith(s);
}
function countsText(c) {
  return ORDER.filter(k => c[k]).map(k => `${KIND[k]} ${c[k]}`).join(' · ') || '변경 없음';
}
function pills(c) {
  return ORDER.filter(k => c[k]).map(k => `<span class="pill ${k}">${KIND[k]} ${c[k]}</span>`).join('') || '<span class="pill">변경 없음</span>';
}
function badges(bc) {
  return Object.keys(bc).map(cls => {
    const n = Object.values(bc[cls]).reduce((a, b) => a + b, 0);
    return `<span class="badge" style="--h:${hue(cls)}">${esc(cls)} ${n}</span>`;
  }).join('');
}
const clsBadge = cls => `<span class="badge" style="--h:${hue(cls)}">${esc(cls)}</span>`;

// ---- 통계 ----
async function loadInfo() {
  try {
    const i = await api('/api/info');
    $('#proj').textContent = i.project;
    if (buildId === null) buildId = i.build;
    if (i.stale) showStale();
    $('#stSnaps').textContent = i.snapshots;
    $('#stAssets').innerHTML = `${i.assets}<small>authored</small>`;
    $('#stStore').innerHTML = `${fmtB(i.store_bytes)}<small>${i.objects}개</small>`;
    $('#stLast').innerHTML = i.last ? `<span style="font-size:15px">${esc(i.last.time.slice(5, 16))}</span><small>#${i.last.id}</small>` : '없음';
    if (typeof applyFold === 'function') applyFold();   // 접힌 상태면 한 줄 요약 갱신
  } catch (e) { /* 통계는 실패해도 UI 는 동작 */ }
}

// ---- 다중 선택 ----
const sel = {changes: new Set(), detail: new Set()};
const anchor = {changes: null, detail: null};
let activeList = 'changes';
const listEl = name => document.querySelector(`[data-list="${name}"]`);
const listRows = name => [...listEl(name).querySelectorAll('tr.row')];
function paintSel(name) {
  const s = sel[name], rows = listRows(name);
  rows.forEach(tr => { tr.classList.toggle('sel', s.has(tr.dataset.rel)); const c = tr.querySelector('td.cb input'); if (c) c.checked = s.has(tr.dataset.rel); });
  const cnt = listEl(name).querySelector('.selcount');
  if (cnt) cnt.textContent = s.size ? `${s.size}개 선택` : '';
  const cb = listEl(name).querySelector('.selall');
  if (cb) { cb.checked = rows.length > 0 && s.size === rows.length; cb.indeterminate = s.size > 0 && s.size < rows.length; }
}
function rowClick(name, tr, e) {
  activeList = name;
  const rels = listRows(name).map(t => t.dataset.rel), rel = tr.dataset.rel, s = sel[name];
  if (e.shiftKey && anchor[name] != null && rels.includes(anchor[name])) {
    const a = rels.indexOf(anchor[name]), b = rels.indexOf(rel), lo = Math.min(a, b), hi = Math.max(a, b);
    if (!e.ctrlKey) s.clear();
    for (let i = lo; i <= hi; i++) s.add(rels[i]);
  } else {
    s.has(rel) ? s.delete(rel) : s.add(rel);
    anchor[name] = rel;
  }
  paintSel(name);
}
function selectAll(name, on) {
  const s = sel[name]; s.clear();
  if (on) listRows(name).forEach(t => s.add(t.dataset.rel));
  paintSel(name);
}
function pruneSel(name) {
  const have = new Set(listRows(name).map(t => t.dataset.rel));
  for (const r of [...sel[name]]) if (!have.has(r)) sel[name].delete(r);
}
function bindList(name, onRow) {
  const el = listEl(name);
  el.querySelectorAll('tr.row').forEach(tr => {
    tr.onclick = e => { rowClick(name, tr, e); if (onRow) onRow(tr); };
    tr.oncontextmenu = e => {
      e.preventDefault(); activeList = name;
      if (!sel[name].has(tr.dataset.rel)) { if (!e.ctrlKey) sel[name].clear(); sel[name].add(tr.dataset.rel); anchor[name] = tr.dataset.rel; paintSel(name); }
      openMenu(e.clientX, e.clientY, menuFor(name));
    };
  });
  const cb = el.querySelector('.selall');
  if (cb) cb.onchange = () => { activeList = name; selectAll(name, cb.checked); };
  pruneSel(name); paintSel(name);
}

// ---- 컨텍스트 메뉴 ----
function openMenu(x, y, items) {
  const m = $('#ctx'); m.innerHTML = '';
  for (const it of items) {
    if (it === '-') { const s = document.createElement('div'); s.className = 'sep'; m.appendChild(s); continue; }
    const d = document.createElement('div');
    d.className = 'item' + (it.disabled ? ' disabled' : '');
    d.innerHTML = `<span class="ic">${it.ic || ''}</span><span>${esc(it.label)}</span>`;
    if (!it.disabled) d.onclick = () => { closeMenu(); it.run(); };
    m.appendChild(d);
  }
  m.style.display = 'block'; m.style.left = '0px'; m.style.top = '0px';
  const r = m.getBoundingClientRect();
  m.style.left = Math.max(0, Math.min(x, innerWidth - r.width - 4)) + 'px';
  m.style.top = Math.max(0, Math.min(y, innerHeight - r.height - 4)) + 'px';
}
function closeMenu() { $('#ctx').style.display = 'none'; }
document.addEventListener('mousedown', e => { if (!$('#ctx').contains(e.target)) closeMenu(); });
window.addEventListener('resize', closeMenu);
document.addEventListener('scroll', closeMenu, true);

function menuFor(name) {
  const rels = [...sel[name]], n = rels.length;
  if (name === 'changes') return [
    {ic:'⬆', label: `선택한 것만 올리기 (${n})`, disabled: !n, run: () => snapFlow(rels)},
    {ic:'⏫', label: '전부 올리기', run: () => snapFlow([])},
    '-',
    {ic:'↩', label: `선택한 것 되돌리기 — 마지막 스냅샷 #${headId ?? '-'} 상태로 (${n})`, disabled: !n || headId == null, run: () => restoreFlow(headId, rels)},
  ];
  return [
    {ic:'↩', label: `선택한 애셋을 이 시점(#${selected})으로 되돌리기 (${n})`, disabled: !n || selected == null, run: () => restoreFlow(selected, rels)},
    {ic:'⟲', label: `이 스냅샷(#${selected}) 전체로 되돌리기`, disabled: selected == null, run: () => restoreFlow(selected, [])},
  ];
}
$('#changes').oncontextmenu = e => {
  if (e.target.closest('tr.row')) return;
  e.preventDefault(); activeList = 'changes'; openMenu(e.clientX, e.clientY, menuFor('changes'));
};

// ---- 모달 ----
function openModal(html) { $('#modalBox').innerHTML = html; $('#modal').style.display = 'flex'; }
function closeModal() { $('#modal').style.display = 'none'; $('#modalBox').innerHTML = ''; }
const modalOpen = () => $('#modal').style.display === 'flex';
$('#modal').onmousedown = e => { if (e.target === $('#modal')) closeModal(); };
function promptMessage(title, hint) {
  return new Promise(res => {
    openModal(`<h3>${esc(title)}</h3><div class="hint">${esc(hint)}</div>
      <input id="mmsg" placeholder="스냅샷 메시지" maxlength="200" value="${esc($('#msg').value)}">
      <div class="btns"><button id="mcancel" class="ghost">취소</button><button id="mok">올리기</button></div>`);
    const inp = $('#mmsg'); inp.focus();
    const done = v => { closeModal(); res(v); };
    $('#mcancel').onclick = () => done(null);
    $('#mok').onclick = () => { const v = inp.value.trim(); if (!v) { inp.focus(); return; } done(v); };
    inp.onkeydown = e => { if (e.key === 'Enter') $('#mok').click(); };
  });
}

// ---- 키보드 ----
document.addEventListener('keydown', e => {
  const inInput = /^(INPUT|TEXTAREA)$/.test(e.target.tagName);
  if (e.key === 'Escape') {
    if ($('#ctx').style.display === 'block') { closeMenu(); return; }
    if (modalOpen()) { closeModal(); return; }
    if ($('#q').value.trim()) { clearSearch(); if (e.target === $('#q')) $('#q').blur(); return; }
    if (sel.changes.size || sel.detail.size) { selectAll('changes', false); selectAll('detail', false); return; }
    if (layout.state.full) { setFull(false); return; }
    return;
  }
  if (e.key === '/' && !inInput && !modalOpen()) { e.preventDefault(); $('#q').focus(); $('#q').select(); return; }
  if (e.key.toLowerCase() === 'f' && !inInput && !modalOpen() && $('#ctx').style.display !== 'block') {
    e.preventDefault(); setFull(!layout.state.full); return;
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'a' && !inInput && !modalOpen()) {
    e.preventDefault(); selectAll(activeList, true);
  }
});

// ---- 데이터 ----
async function loadLog() {
  status('불러오는 중…');
  try {
    lastLog = await api('/api/log');
    headId = lastLog.length ? Math.max(...lastLog.map(s => s.id)) : null;
    renderTimeline();
    status(`스냅샷 ${lastLog.length}개`);
    loadInfo();
  } catch (e) { status('오류: ' + e.message); }
}
function renderTimeline() {
  const tl = $('#timeline');
  tl.innerHTML = lastLog.length ? '' : '<div class="empty" style="padding:30px;text-align:center" ><div class="dim">아직 스냅샷이 없습니다<br><span class="hint">위에서 메시지를 적고 "스냅샷 만들기"</span></div></div>';
  if (searchHits && !searchHits.size) tl.innerHTML = '<div class="empty" style="padding:30px;text-align:center"><div class="dim">일치하는 스냅샷 없음</div></div>';
  let hidden = [];
  const flush = () => {
    if (!hidden.length) return;
    const div = document.createElement('div');
    div.className = 'hidden-noise'; div.title = '클릭하면 리세이브 스냅샷을 펼칩니다';
    div.textContent = `리세이브 스냅샷 ${hidden.length}개 숨김 (#${hidden[hidden.length - 1]}–#${hidden[0]})`;
    div.onclick = () => setShowNoise(true);
    tl.appendChild(div); hidden = [];
  };
  for (const s of lastLog) {
    const hit = searchHits ? searchHits.get(s.id) : null;
    if (searchHits && !hit) continue;
    if (!searchHits && s.all_noise && !showNoise && s.id !== selected) { hidden.push(s.id); continue; }
    flush();
    const div = document.createElement('div');
    div.className = `snap ${s.kind}` + (s.all_noise ? ' noise' : '') + (s.id === selected ? ' sel' : '')
      + (tlSel.has(s.id) ? ' msel' : '');
    div.dataset.id = s.id;
    div.innerHTML = `<div class="msg"><span class="id">#${s.id}</span>${esc(s.message || (s.kind === 'auto' ? '자동 저장' : ''))}${s.all_noise ? ' <span class="badge noise">리세이브만</span>' : ''}</div>
      <div class="meta">${esc(s.time)} · ${s.total}개 추적</div>
      <div class="counts">${pills(s.counts)}</div><div>${badges(s.by_class)}</div>` + hitsHtml(hit);
    div.onclick = e => snapClick(s.id, e);
    div.oncontextmenu = e => snapMenu(s.id, e);
    tl.appendChild(div);
  }
  flush();
}

// ---- 타임라인 다중 선택 ----
const tlIds = () => [...document.querySelectorAll('#timeline .snap')].map(e => +e.dataset.id);
function paintTlSel() {
  document.querySelectorAll('#timeline .snap').forEach(e => e.classList.toggle('msel', tlSel.has(+e.dataset.id)));
}
function snapClick(id, e) {
  if (e.ctrlKey || e.metaKey) {
    tlSel.has(id) ? tlSel.delete(id) : tlSel.add(id);
    tlAnchor = id; paintTlSel(); return;
  }
  if (e.shiftKey) {
    const ids = tlIds(), a = ids.indexOf(tlAnchor == null ? id : tlAnchor), b = ids.indexOf(id);
    if (a >= 0 && b >= 0) { const lo = Math.min(a, b), hi = Math.max(a, b); for (let i = lo; i <= hi; i++) tlSel.add(ids[i]); }
    else tlSel.add(id);
    paintTlSel(); return;
  }
  tlSel.clear(); paintTlSel(); select(id);
}
// 선택이 부모-자식으로 이어진 사슬이면 오름차순 id 목록, 아니면 null
function tlChain() {
  const ids = [...tlSel].sort((a, b) => a - b);
  if (ids.length < 2) return null;
  const by = new Map(lastLog.map(s => [s.id, s]));
  for (let i = 1; i < ids.length; i++) { const s = by.get(ids[i]); if (!s || s.parent !== ids[i - 1]) return null; }
  return ids;
}
function snapMenu(id, e) {
  e.preventDefault();
  if (!tlSel.has(id)) { if (!e.ctrlKey) tlSel.clear(); tlSel.add(id); tlAnchor = id; paintTlSel(); }
  const chain = tlChain();
  openMenu(e.clientX, e.clientY, [
    {ic:'🗜', label:`선택한 ${tlSel.size}개를 하나로 묶고 이름 붙이기`, disabled: !chain, run: () => squashFlow(chain)},
    {ic:'⟲', label:`이 스냅샷(#${id})으로 되돌리기`, run: () => restoreFlow(id, [])},
  ]);
}
function squashPrompt(n, def) {

// 사라질 라벨 목록을 보여주고 강행 여부를 묻는다
function squashLabelsConfirm(labels) {

    const done = v => { closeModal(); res(v); };

    $('#slok').onclick = () => done(true);

async function squashFlow(ids) {
  if (!ids) return;
  const by = new Map(lastLog.map(s => [s.id, s]));
  const def = ids.map(i => by.get(i)).filter(s => s && s.kind === 'label' && s.message)
                 .map(s => s.message).join(' + ');
  const message = await squashPrompt(ids.length, def);
  if (!message) return;
  const send = async include_labels => {
    const r = await api('/api/squash', {method:'POST', headers:JSONH,
      body:JSON.stringify({ids, message, include_labels})});
    tlSel.clear(); tlAnchor = null;
    await loadLog(); await select(r.snapshot.id);
    toast(`#${r.snapshot.id} 로 묶음 · 스냅샷 ${r.removed}개 정리`);
  };
  try {
    await send(false);
  } catch (e) {
    const labels = (e.status === 409 && e.body && Array.isArray(e.body.labels)) ? e.body.labels : [];
    if (!labels.length) { toast('오류: ' + e.message, true); return; }
    if (!await squashLabelsConfirm(labels)) return;
    try { await send(true); } catch (e2) { toast('오류: ' + e2.message, true); }
  }
}

function rows(d) {
  const out = [];
  for (const x of d.modified) if (!x.new.noise) out.push(['M', x.new.rel, x.new.cls, `${fmtB(x.old.size)} → ${fmtB(x.new.size)}`, false, x.new.sha]);
  for (const x of d.added) out.push(['A', x.rel, x.cls, fmtB(x.size), false, x.sha]);
  for (const x of d.moved) out.push(['R', x.new.rel, x.new.cls, `← ${x.old.rel}`, false, x.new.sha]);
  for (const x of d.deleted) out.push(['D', x.rel, x.cls, fmtB(x.size), false, x.sha]);
  for (const x of d.modified) if (x.new.noise) out.push(['M', x.new.rel, x.new.cls, `${fmtB(x.new.size)} · 리세이브만`, true, x.new.sha]);
  return out;
}
// thumbBy: 'sha' = store 객체(스냅샷 상세·모달), 'rel' = 작업 트리 현재 파일(변경사항 패널, 삭제 행은 sha)
function thumbSrc(thumbBy, k, rel, sha) {
  if (thumbBy === 'rel' && k !== 'D') return '/api/thumb?rel=' + encodeURIComponent(rel);
  return sha ? '/api/thumb?sha=' + sha : '';
}
function diffTable(d, listName, withClass = true, thumbBy = 'sha') {
  const rs = rows(d);
  if (!rs.length) return '<p class="dim">변경 없음</p>';
  let h = '<table><tr>' + (listName ? '<th class="cb"><input type="checkbox" class="selall" title="전체 선택/해제"></th>' : '') +
    `<th class="tn"></th><th></th><th>애셋${listName ? ' <span class="selcount"></span>' : ''}</th><th>클래스</th><th></th></tr>`;
  for (const [k, rel, cls, extra, noise, sha] of rs)
    h += `<tr class="${listName ? 'row' : ''}${noise ? ' noise' : ''}" data-rel="${esc(rel)}">` + (listName ? `<td class="cb"><input type="checkbox" tabindex="-1" ${sel[listName].has(rel) ? 'checked' : ''}></td>` : '') +
      `<td class="tn">${thumbHtml(cls, thumbSrc(thumbBy, k, rel, sha))}</td>` +
      `<td class="k ${k}" title="${noise ? '리세이브만(헤더만 변경)' : KIND[{A:'added',M:'modified',R:'moved',D:'deleted'}[k]]}"><span>${k}${noise ? '~' : ''}</span></td><td>${relHtml(rel)}</td><td>${clsBadge(cls)}</td><td class="dim">${esc(extra)}</td></tr>`;
  h += '</table>';
  if (d.counts && d.counts.resave) h += `<div class="hint">리세이브만 ${d.counts.resave}${d.all_noise ? ' · 이 변경은 전부 리세이브만' : ''}</div>`;
  const bc = Object.keys(d.by_class);
  if (withClass && bc.length) {
    h += '<div class="agg">' + bc.map(cls => `<div class="cell">${clsBadge(cls)}<span>${pills(d.by_class[cls])}</span></div>`).join('') + '</div>';
  }
  return h;
}

const META_HINT = '이 버전은 내용 기록이 없습니다 — 에디터가 켜져 있고 브릿지가 연결된 상태에서 찍힌 스냅샷부터 기록됩니다';
function metaCell(v) { return `<td>${esc(v)}</td>`; }
function metaTable(diff, cols) {
  let h = '<table><tr><th>행</th>' + cols.map(c => `<th>${esc(c)}</th>`).join('') + '</tr>';
  for (const r of diff.rows_changed) {
    const byCol = {}; for (const c of r.cells) byCol[c.col] = c;
    h += `<tr class="mrow"><td class="rname">${esc(r.row)}</td>` + cols.map(c => {
      const x = byCol[c];
      if (!x) return '<td class="dim">·</td>';
      return `<td><span class="old">${esc(x.old || '(없음)')}</span><span class="arrow">→</span><span class="new">${esc(x.new || '(없음)')}</span></td>`;
    }).join('') + '</tr>';
  }
  for (const r of diff.rows_added)
    h += `<tr class="mrow add"><td class="rname">+ ${esc(r.row)}</td>` + cols.map(c => metaCell(r.cells[c] ?? '')).join('') + '</tr>';
  for (const r of diff.rows_removed)
    h += `<tr class="mrow del"><td class="rname">− ${esc(r.row)}</td>` + cols.map(c => metaCell(r.cells[c] ?? '')).join('') + '</tr>';
  return h + '</table>';
}
async function showMetaDiff(box, aSha, bSha) {
  const head = '<div class="sect"><h3>내용 변경</h3><span class="hint">DataTable 값 비교</span></div>';
  box.innerHTML = head + '<p class="dim">불러오는 중…</p>';
  let r;
  try { r = await api(`/api/metadiff?a=${aSha || ''}&b=${bSha}`); }
  catch (e) { box.innerHTML = head + `<div class="err">${esc(e.message)}</div>`; return; }
  if (!r.available) { box.innerHTML = head + `<div class="note">${META_HINT}</div>`; return; }
  const d = r.diff;
  const cols = [];
  for (const row of d.rows_changed) for (const c of row.cells) if (!cols.includes(c.col)) cols.push(c.col);
  for (const row of [...d.rows_added, ...d.rows_removed]) for (const c of Object.keys(row.cells)) if (!cols.includes(c)) cols.push(c);
  let h = head;
  if (d.columns_added.length || d.columns_removed.length)
    h += '<div class="cols">' + d.columns_added.map(c => `<span class="pill added">+ ${esc(c)}</span>`).join('') +
         d.columns_removed.map(c => `<span class="pill deleted">− ${esc(c)}</span>`).join('') + '</div>';
  const n = d.rows_changed.length + d.rows_added.length + d.rows_removed.length;
  h += n ? metaTable(d, cols) : '<p class="dim">값 변경 없음</p>';
  if (d.unchanged) h += `<div class="same">변경 없는 행 ${d.unchanged}개</div>`;
  box.innerHTML = h;
}

async function uediffFlow(rel, aSha, bSha) {
  const body = bSha ? {rel, a: aSha, b: bSha} : {rel, a: aSha};
  try {
    const plan = await api('/api/uediff/plan').catch(() => ({mode: 'editor'}));
    if (plan.mode === 'process') {
      const go = await confirmModal('에디터가 꺼져 있습니다',
        'diff 를 보려면 에디터를 새로 띄워야 하며 1분쯤 걸립니다. 띄울까요?', '에디터 띄우기');
      if (!go) return;
    }
    toast('언리얼 diff 창을 여는 중…');
    const r = await api('/api/uediff', {method: 'POST', headers: JSONH, body: JSON.stringify(body)});
    toast(r.mode === 'editor' ? '에디터에서 diff 창을 열었습니다'
      : '새 에디터로 엽니다 — 1분쯤 걸릴 수 있습니다');
  } catch (e) {
    if (e.status === 409) {
      const editorOn = e.body && e.body.mode === 'editor';
      openModal(`<h3>${editorOn ? 'diff 창을 열지 못했습니다' : '언리얼 에디터를 찾지 못했습니다'}</h3>` +
        `<div class="err">${esc(e.message)}</div>` +
        `<div class="btns"><button class="ghost" onclick="closeModal()">닫기</button></div>`);
    } else toast('오류: ' + e.message, true);
  }
}

// ---- 올리기 ----
async function snapFlow(only) {
  const message = await promptMessage(only.length ? `선택한 ${only.length}개만 올리기` : '전부 올리기',
    only.length ? only.join(', ') : '현재 변경사항 전체를 라벨 스냅샷으로 만듭니다.');
  if (!message) return;
  status('스냅샷 만드는 중…');
  try {
    const r = await api('/api/snap', {method: 'POST', headers: JSONH, body: JSON.stringify({message, only})});
    $('#msg').value = '';
    await loadLog(); await loadStatus();
    if (r.snapshot) { toast(`#${r.snapshot.id} 올림 · ${countsText(r.diff.counts)}`); await select(r.snapshot.id); }
    else toast('선택한 애셋에 변경이 없어 스냅샷을 만들지 않았습니다', true);
    status(`스냅샷 ${headId != null ? '#' + headId + ' 까지' : '없음'}`);
  } catch (e) { toast('오류: ' + e.message, true); status('오류: ' + e.message); }
}

// ---- 되돌리기: 드라이런 모달 → 확인 → 적용 ----
function refList(title, xs) {
  return `<div class="err"><b>경고: ${esc(title)} (${xs.length})</b><br>` + xs.map(x => `! ${esc(x.rel)} → ${esc(x.dep)}`).join('<br>') + '</div>';
}
async function restoreFlow(id, assets) {
  const scope = assets.length ? `선택 ${assets.length}개` : '전체';
  openModal(`<h3>#${id} 로 되돌리기 (${esc(scope)})</h3><p class="dim">계산 중…</p>`);
  let p;
  try {
    const qs = assets.map(a => 'asset=' + encodeURIComponent(a)).join('&');
    p = await api(`/api/restore/${id}` + (qs ? '?' + qs : ''));
  } catch (e) {
    openModal(`<h3>#${id} 로 되돌리기</h3><div class="err">${esc(e.message)}</div><div class="btns"><button class="ghost" onclick="closeModal()">닫기</button></div>`);
    return;
  }
  const n = rows(p.diff).length;
  let html = `<h3>#${id} ${esc(p.snapshot.message || '자동 저장')} 로 되돌리기 <span class="dim" style="font-weight:500">(${esc(scope)})</span></h3>
    <div class="dim">${esc(p.snapshot.time)} · 현재 → #${id}</div><div class="bar" style="margin:8px 0">${pills(p.diff.counts)}</div>` + diffTable(p.diff, null);
  if (p.dependents.length) html += refList('롤백으로 사라지는 애셋을 참조', p.dependents);
  if (p.broken.length) html += refList('깨질 참조', p.broken);
  if (n && !p.dependents.length && !p.broken.length) html += '<p class="ok">✓ 참조 검산: 이상 없음</p>';
  html += '<div class="note">🛡 되돌릴 애셋의 현재 상태만 안전 스냅샷으로 남습니다. 다른 애셋의 올리지 않은 변경은 그대로 유지됩니다.</div>';
  html += `<div id="restoreErr"></div><div class="btns"><button id="rcancel" class="ghost">취소</button><button id="rok" class="danger" ${n ? '' : 'disabled'}>${n ? `되돌리기 (${n}개 변경)` : '변경 없음'}</button></div>`;
  openModal(html);
  $('#rcancel').onclick = closeModal;
  $('#rok').onclick = () => applyRestore(id, assets, false);
}
async function applyRestore(id, assets, discard) {
  const btn = $('#rok'), box = $('#restoreErr');
  btn.disabled = true; btn.textContent = '적용 중…'; box.innerHTML = '';
  try {
    const r = await api('/api/restore/' + id, {method: 'POST', headers: JSONH, body: JSON.stringify({assets, discard_dirty: discard})});
    closeModal();
    const safetyTag = (r.safety_created === false) ? '되돌리기 전 상태' : '안전 스냅샷';
    toast(`롤백 완료 #${r.result.id} · ${safetyTag} #${r.safety.id} · 복사 ${r.written} · 삭제 ${r.deleted}`,
      false, {label: '실행 취소', ms: 10000, run: () => undoRestore(r.safety.id, assets)});
    await loadLog(); await loadStatus(); await select(r.result.id);
  } catch (e) {
    const dirty = (e.status === 409 && e.body && Array.isArray(e.body.dirty)) ? e.body.dirty : [];
    const locked = (e.status === 409 && e.body && Array.isArray(e.body.locked)) ? e.body.locked : [];
    if (locked.length) {
      box.innerHTML = `<div class="err"><b>${esc(e.message)}</b><br>잠긴 파일 (${locked.length}) — 에디터에서 그 애셋의 편집 창을 닫고 다시 시도하세요:<ul class="dirty">` +
        locked.map(x => `<li>${esc(x)}</li>`).join('') + `</ul></div>`;
    } else if (dirty.length) {
      box.innerHTML = `<div class="err"><b>${esc(e.message)}</b><br>에디터에 저장하지 않은 변경 (${dirty.length}):<ul class="dirty">` +
        dirty.map(x => `<li>${esc(x)}</li>`).join('') + `</ul><div class="btns"><button id="rdiscard" class="danger">저장 안 한 변경 버리고 진행</button></div></div>`;
      $('#rdiscard').onclick = () => applyRestore(id, assets, true);
    } else box.innerHTML = `<div class="err">${esc(e.message)}</div>`;
    btn.disabled = false; btn.textContent = '되돌리기';
  }
}

// 롤백 실행 취소: 확인 모달 없이 안전 스냅샷으로 되돌린다. 실패(409 등)는 기존 모달 흐름으로
async function undoRestore(safetyId, assets) {
  status('실행 취소 중…');
  try {
    const r = await api('/api/restore/' + safetyId, {method: 'POST', headers: JSONH, body: JSON.stringify({assets, discard_dirty: false})});
    toast(`실행 취소 완료 #${r.result.id}`);
    await loadLog(); await loadStatus(); await select(r.result.id);
    status(`실행 취소 완료 #${r.result.id}`);
  } catch (e) {
    status('실행 취소 실패: ' + e.message);
    restoreFlow(safetyId, assets);
  }
}

// ---- 레이아웃(경계선·접기·크게 보기·보기 옵션) ----
const LAYOUT_KEY = 'jokate.layout.v1';
const LAYOUT_DEFAULT = () => ({
  leftW: 380, changesH: 300, histH: 300,
  folds: {stats: false, changes: false, tlcard: false, hist: false},
  full: false,
  density: 'normal', verThumb: 156, rowThumb: true,
});
// 순수 함수: 뷰포트에 맞춰 값 범위를 clamp
function clampLayout(state, viewport) {
  const s = Object.assign({}, LAYOUT_DEFAULT(), state, {folds: Object.assign({}, LAYOUT_DEFAULT().folds, state && state.folds)});
  const vw = (viewport && viewport.w) || innerWidth, vh = (viewport && viewport.h) || innerHeight;
  s.leftW = Math.max(260, Math.min(s.leftW, Math.round(vw * 0.6)));
  s.changesH = Math.max(80, Math.min(s.changesH, Math.round(vh * 0.75)));
  s.histH = Math.max(80, Math.min(s.histH, Math.round(vh * 0.75)));
  if (!['compact', 'normal', 'roomy'].includes(s.density)) s.density = 'normal';
  if (![96, 156, 224].includes(s.verThumb)) s.verThumb = 156;
  s.rowThumb = !!s.rowThumb;
  s.full = !!s.full && vw > 900;
  return s;
}
function loadLayout() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(LAYOUT_KEY) || 'null'); } catch (e) { s = null; }
  if (!s || typeof s !== 'object') s = LAYOUT_DEFAULT();
  return clampLayout(s, {w: innerWidth, h: innerHeight});
}
function saveLayout() { try { localStorage.setItem(LAYOUT_KEY, JSON.stringify(layout.state)); } catch (e) { /* 저장 실패는 무시 */ } }
const layout = {state: loadLayout()};
const DENSITY_VAL = {compact: {pad: '4px', fs: '12px'}, normal: {pad: '7px', fs: '13px'}, roomy: {pad: '10px', fs: '14px'}};
function applyLayout() {
  const s = layout.state, root = document.documentElement.style;
  root.setProperty('--left-w', s.leftW + 'px');
  root.setProperty('--changes-h', s.changesH + 'px');
  root.setProperty('--hist-h', s.histH + 'px');
  const d = DENSITY_VAL[s.density] || DENSITY_VAL.normal;
  root.setProperty('--row-pad', d.pad); root.setProperty('--row-fs', d.fs);
  root.setProperty('--ver-thumb', s.verThumb + 'px');
  document.body.classList.toggle('nothumb', !s.rowThumb);
  $('#main').classList.toggle('full', s.full);
  applyFold();
  document.querySelectorAll('#viewMenu [data-density]').forEach(b => b.classList.toggle('on', b.dataset.density === s.density));
  document.querySelectorAll('#viewMenu [data-verthumb]').forEach(b => b.classList.toggle('on', +b.dataset.verthumb === s.verThumb));
  $('#optRowThumb').checked = s.rowThumb;
  document.querySelectorAll('.fold[data-fold]').forEach(b => {
    const on = !!layout.state.folds[b.dataset.fold];
    b.textContent = on ? '▸' : '▾';
  });
}
function applyFold() {
  const f = layout.state.folds;
  $('#statsWrap').classList.toggle('folded', !!f.stats);
  if (f.stats) {
    const t = +($('#stChanges').textContent.match(/\d+/) || [0])[0] || 0;
    const sn = $('#stSnaps').textContent, st = $('#stStore').querySelector ? $('#stStore').textContent : '';
    $('#statsMini').textContent = `올릴 변경 ${t} · 스냅샷 ${sn} · 저장소 ${st}`;
  }
  $('#changes').classList.toggle('folded', !!f.changes);
  $('#tlcard').classList.toggle('folded', !!f.tlcard);
  $('#detail').classList.toggle('histfold', !!f.hist);
}
function toggleFold(name) {
  layout.state.folds[name] = !layout.state.folds[name];
  applyLayout(); saveLayout();
}
// 히스토리 헤더처럼 나중에 그려지는 토글도 잡도록 위임 방식으로 바인딩
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('.fold[data-fold]');
  if (!b) return;
  e.stopPropagation(); e.preventDefault(); toggleFold(b.dataset.fold);
});

function setFull(on) {
  const vw = innerWidth; if (vw <= 900) return;
  layout.state.full = !!on; applyLayout(); saveLayout();
}
$('#fullBtn').onclick = () => setFull(!layout.state.full);

// ---- 드래그 경계선 ----
function bindSplitter(el, opts) {
  // opts: {get, set, min, max, axis:'x'|'y', step, dbl}
  let dragging = false, startPos = 0, startVal = 0;
  const onMove = e => {
    if (!dragging) return;
    const cur = opts.axis === 'x' ? e.clientX : e.clientY;
    let v = startVal + (cur - startPos);
    v = Math.max(opts.min(), Math.min(opts.max(), v));
    opts.set(v); applyLayout();
  };
  const onUp = e => {
    if (!dragging) return;
    dragging = false; el.classList.remove('drag'); document.body.classList.remove('dragging');
    try { el.releasePointerCapture(e.pointerId); } catch (er) {}
    saveLayout();
  };
  el.addEventListener('pointerdown', e => {
    dragging = true; startPos = opts.axis === 'x' ? e.clientX : e.clientY; startVal = opts.get();
    el.classList.add('drag'); document.body.classList.add('dragging');
    el.setPointerCapture(e.pointerId);
  });
  el.addEventListener('pointermove', onMove);
  el.addEventListener('pointerup', onUp);
  el.addEventListener('pointercancel', onUp);
  el.addEventListener('dblclick', () => { opts.set(opts.dbl()); applyLayout(); saveLayout(); });
  el.addEventListener('keydown', e => {
    const step = opts.step || 16;
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { opts.set(Math.max(opts.min(), opts.get() - step)); applyLayout(); saveLayout(); e.preventDefault(); }
    else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { opts.set(Math.min(opts.max(), opts.get() + step)); applyLayout(); saveLayout(); e.preventDefault(); }
  });
}
bindSplitter($('#vsplit'), {
  axis: 'x', get: () => layout.state.leftW, set: v => layout.state.leftW = v,
  min: () => 260, max: () => Math.round(innerWidth * 0.6), dbl: () => 380,
});
bindSplitter($('#hsplit'), {
  axis: 'y', get: () => layout.state.changesH, set: v => layout.state.changesH = v,
  min: () => 80, max: () => Math.round($('#left').getBoundingClientRect().height * 0.75), dbl: () => 300,
});
// histSplit 은 아래쪽(#histPane) 높이를 늘리려면 위로 드래그해야 하므로 부호를 반대로 사용 (bindSplitter 미사용, 전용 로직)
(function fixHistSplit() {
  let dragging = false, startPos = 0, startVal = 0;
  const el = $('#histSplit');
  const onMove = e => {
    if (!dragging) return;
    const v = Math.max(80, Math.min(Math.round(innerHeight * 0.75), startVal - (e.clientY - startPos)));
    layout.state.histH = v; applyLayout();
  };
  const onUp = e => { if (!dragging) return; dragging = false; el.classList.remove('drag'); document.body.classList.remove('dragging'); try { el.releasePointerCapture(e.pointerId); } catch (er) {} saveLayout(); };
  el.onpointerdown = e => { dragging = true; startPos = e.clientY; startVal = layout.state.histH; el.classList.add('drag'); document.body.classList.add('dragging'); el.setPointerCapture(e.pointerId); };
  el.onpointermove = onMove; el.onpointerup = onUp; el.onpointercancel = onUp;
  el.ondblclick = () => { layout.state.histH = 300; applyLayout(); saveLayout(); };
  el.onkeydown = e => {
    if (e.key === 'ArrowUp') { layout.state.histH = Math.min(Math.round(innerHeight * 0.75), layout.state.histH + 16); applyLayout(); saveLayout(); e.preventDefault(); }
    else if (e.key === 'ArrowDown') { layout.state.histH = Math.max(80, layout.state.histH - 16); applyLayout(); saveLayout(); e.preventDefault(); }
  };
})();

// ---- 보기 옵션 메뉴 ----
function openViewMenu() {
  const m = $('#viewMenu'), btn = $('#viewBtn');
  const r = btn.getBoundingClientRect();
  m.style.display = 'block';
  m.style.left = Math.max(0, Math.min(r.left, innerWidth - 240)) + 'px';
  m.style.top = (r.bottom + 6) + 'px';
}
function closeViewMenu() { $('#viewMenu').style.display = 'none'; }
$('#viewBtn').onclick = e => { e.stopPropagation(); $('#viewMenu').style.display === 'block' ? closeViewMenu() : openViewMenu(); };
document.addEventListener('mousedown', e => { if (!$('#viewMenu').contains(e.target) && e.target !== $('#viewBtn')) closeViewMenu(); });
document.querySelectorAll('#viewMenu [data-density]').forEach(b => b.onclick = () => { layout.state.density = b.dataset.density; applyLayout(); saveLayout(); });
document.querySelectorAll('#viewMenu [data-verthumb]').forEach(b => b.onclick = () => { layout.state.verThumb = +b.dataset.verthumb; applyLayout(); saveLayout(); });
$('#optRowThumb').onchange = e => { layout.state.rowThumb = e.target.checked; applyLayout(); saveLayout(); };
$('#resetLayout').onclick = () => { layout.state = LAYOUT_DEFAULT(); applyLayout(); saveLayout(); closeViewMenu(); };

window.addEventListener('resize', () => { layout.state = clampLayout(layout.state, {w: innerWidth, h: innerHeight}); applyLayout(); saveLayout(); });
applyLayout();

// ---- 헤더 ----
$('#mksnap').onclick = async () => {
  const message = $('#msg').value.trim();
  if (!message) { status('메시지를 입력하세요'); $('#msg').focus(); return; }
  $('#mksnap').disabled = true; status('스냅샷 만드는 중…');
  try {
    const r = await api('/api/snap', {method: 'POST', headers: JSONH, body: JSON.stringify({message})});
    $('#msg').value = '';
    await loadLog(); await loadStatus();
    if (r.snapshot) { await select(r.snapshot.id); status(`#${r.snapshot.id} 생성 · ${countsText(r.diff.counts)} · 새 객체 ${r.stored}`); toast(`#${r.snapshot.id} 스냅샷 생성`); }
  } catch (e) { status('오류: ' + e.message); }
  finally { $('#mksnap').disabled = false; }
};
$('#msg').onkeydown = e => { if (e.key === 'Enter') $('#mksnap').click(); };
$('#reload').onclick = () => { loadLog(); loadStatus(); };
$('#reloadStatus').onclick = loadStatus;
setInterval(loadStatus, 30000);

// ---- 데몬 상태 칩 ----
let daemon = null;
function paintDaemon() {
  const c = $('#dchip'), b = $('#dstop');
  if (!daemon) { c.textContent = '상태 확인 불가'; c.className = 'pill'; b.style.display = 'none'; return; }
  if (daemon.running) {
    c.className = 'pill act ' + (daemon.paused ? 'paused' : 'on');
    c.textContent = daemon.paused ? '일시정지' : '● 자동 스냅샷 켜짐';
    c.title = (daemon.paused ? '클릭하면 자동 스냅샷 재개' : '클릭하면 일시정지')
      + (daemon.last_line ? '\n' + daemon.last_line : '');
    b.style.display = '';
  } else {
    c.className = 'pill';
    c.textContent = '자동 스냅샷 꺼짐 - serve 단독';
    c.title = '자동 스냅샷 없이 웹 UI 만 실행 중';
    b.style.display = 'none';
  }
}
async function loadDaemon() {
  try { daemon = await api('/api/daemon'); } catch (e) { daemon = null; }
  paintDaemon();
}
$('#dchip').onclick = async () => {
  if (!daemon || !daemon.running) return;
  try {
    daemon = await api('/api/daemon', {method: 'POST', headers: JSONH, body: JSON.stringify({action: daemon.paused ? 'resume' : 'pause'})});
    paintDaemon();
    toast(daemon.paused ? '자동 스냅샷 일시정지' : '자동 스냅샷 재개');
  } catch (e) { toast('오류: ' + e.message, true); }
};
$('#staleRestart').onclick = () => restartServer();
$('#dstop').onclick = async () => {
  if (!confirm('자동 스냅샷과 웹 서버를 종료할까요?')) return;
  try { await api('/api/daemon', {method: 'POST', headers: JSONH, body: JSON.stringify({action: 'stop'})}); }
  catch (e) { toast('오류: ' + e.message, true); return; }
  const d = document.createElement('div');
  d.id = 'dead';
  d.innerHTML = '<div>서버가 종료되었습니다<div style="font-size:13px;font-weight:400;margin-top:8px">다시 쓰려면 start.bat 을 실행하세요</div></div>';
  document.body.appendChild(d);
};
setInterval(loadDaemon, 10000);

// ---- URL 쿼리 (에디터 메뉴에서 열림) ----
async function openFromQuery() {
  const q = new URLSearchParams(location.search);
  const asset = q.get('asset'), view = q.get('view');
  if (view === 'status') { const c = $('#changes'); c.classList.add('hot'); c.scrollIntoView({block: 'start'}); setTimeout(() => c.classList.remove('hot'), 6000); }
  if (asset && headId != null) {
    await select(headId);
    const tr = listRows('detail').find(r => r.dataset.rel === asset) || null;
    if (tr) { sel.detail.clear(); sel.detail.add(asset); paintSel('detail'); }
    await showHistory(asset, tr);
    $('#histPane').scrollTop = 0;
  } else if (asset) status('스냅샷이 없어 히스토리를 열 수 없음: ' + asset);
}
$('#pruneBtn').onclick = () => pruneFlow();
(async () => { await loadLog(); await loadStatus(); await loadDaemon(); await openFromQuery(); })();
</script>
